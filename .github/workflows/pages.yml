# Publie le site compilé sur GitHub Pages (holosene.github.io/Portfolio/), servi sous https://holosene.fr/ par le
# Worker Cloudflare (cloudflare/holosene-worker) : la page HOLOSENE à la racine, le portfolio dans /portfolio/
# (scripts/site-holosene.mjs), les projets dans /portfolio/<nom>/ (relayés depuis leur propre dépôt).
# GitHub Pages ne compile rien : sans ce workflow, il servait les fichiers sources (index.html non compilé, page vide).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /portfolio/
          SITE_URL: https://holosene.fr/portfolio/
      # pas de mise en ligne si FR/EN recharge la page (scripts/test-lang.mjs)
      - run: npx playwright install --with-deps chromium
      - run: npm run test:lang
      - run: node scripts/site-holosene.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
